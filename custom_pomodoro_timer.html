<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 뽀모도로 타이머</title>
    <style>
        :root {
            --bg-color: #f4f9fc;
            --main-color: #9DD1F1; /* 요청하신 파스텔 블루 */
            --main-dark: #63b3e3;
            --text-color: #2c3e50;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(157, 209, 241, 0.25);
            width: 340px;
        }

        /* 아날로그 타이머 외형 */
        .timer-case {
            width: 260px;
            height: 260px;
            background-color: #ffffff;
            border-radius: 48px;
            box-shadow: inset 0 0 0 2px #eaf4fa, 0 8px 25px rgba(0,0,0,0.04);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* 다이얼 및 시계 눈금 */
        .timer-dial {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
        }

        /* 부채꼴 섹터 (#9DD1F1) */
        .ocean-sector {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--main-color) 0deg, var(--main-color) var(--sweep-angle, 150deg), transparent var(--sweep-angle, 150deg));
            opacity: 0.9;
            transition: background 0.2s ease;
        }

        /* 눈금 레이어 */
        .tick-marks {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 2;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background-color: #cbdbe6;
            top: 4px;
            left: 50%;
            transform-origin: 50% 106px;
        }

        .tick.major {
            height: 12px;
            width: 2.5px;
            background-color: var(--main-dark);
        }

        .tick-label {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            color: #647b8c;
            width: 30px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            left: calc(50% - 15px);
            top: 20px;
            transform-origin: 50% 90px;
        }

        /* 중앙 노브 */
        .knob {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, #ffffff, #f0f7fb);
            border: 1px solid #dbe8f0;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            z-index: 4;
        }

        .knob::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            width: 3px;
            height: 10px;
            background-color: var(--main-dark);
            border-radius: 2px;
            transform: translateX(-50%);
        }

        /* 바늘 */
        .hand {
            position: absolute;
            width: 4px;
            height: 85px;
            background: var(--main-dark);
            bottom: 50%;
            left: calc(50% - 2px);
            transform-origin: 50% 100%;
            border-radius: 4px;
            z-index: 3;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 시간 설정 입력창 및 디지털 시간 */
        .time-setting-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .time-input {
            width: 65px;
            height: 50px;
            border: 2px solid #e1eef6;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
            background-color: #fafdfd;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .time-input:focus {
            border-color: var(--main-dark);
            background-color: #ffffff;
        }

        .time-separator {
            font-size: 28px;
            font-weight: 700;
            color: var(--main-dark);
            user-select: none;
        }

        /* 버튼 컨트롤 */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--main-color);
            color: #2c3e50;
            box-shadow: 0 6px 16px rgba(157, 209, 241, 0.4);
        }

        .btn-primary:hover {
            background-color: #8cc4e8;
            transform: translateY(-1px);
        }

        .btn-primary.running {
            background-color: #ff9b9b;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(255, 155, 155, 0.4);
        }

        .btn-secondary {
            background-color: #f0f5f9;
            color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #e2ebf2;
            color: #334155;
        }

        /* 퀵 버튼 */
        .quick-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 18px;
        }

        .quick-btn {
            flex: 1;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #e1eef6;
            background-color: #f7fafc;
            color: #526878;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background-color: var(--main-color);
            color: #2c3e50;
            border-color: var(--main-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 아날로그 타이머 -->
        <div class="timer-case">
            <div class="timer-dial">
                <div class="ocean-sector" id="sector"></div>
                <div class="tick-marks" id="ticks"></div>
                <div class="hand" id="hand"></div>
                <div class="knob"></div>
            </div>
        </div>

        <!-- 퀵 추천 시간 버튼 -->
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setQuickTime(25, 0)">25분</button>
            <button class="quick-btn" onclick="setQuickTime(10, 0)">10분</button>
            <button class="quick-btn" onclick="setQuickTime(5, 0)">5분</button>
            <button class="quick-btn" onclick="setQuickTime(1, 0)">1분</button>
        </div>

        <!-- 분 : 초 직접 입력창 -->
        <div class="time-setting-container">
            <input type="number" id="min-input" class="time-input" min="0" max="60" value="25" placeholder="00" onchange="validateAndUpdate()" oninput="validateAndUpdate()">
            <span class="time-separator">:</span>
            <input type="number" id="sec-input" class="time-input" min="0" max="59" value="00" placeholder="00" onchange="validateAndUpdate()" oninput="validateAndUpdate()">
        </div>

        <!-- 버튼 -->
        <div class="controls">
            <button class="btn btn-primary" id="start-btn" onclick="toggleTimer()">시작</button>
            <button class="btn btn-secondary" onclick="resetTimer()">리셋</button>
        </div>
    </div>

    <script>
        const ticksContainer = document.getElementById('ticks');
        const hand = document.getElementById('hand');
        const sector = document.getElementById('sector');
        const minInput = document.getElementById('min-input');
        const secInput = document.getElementById('sec-input');
        const startBtn = document.getElementById('start-btn');

        // 눈금 생성 (0~60분 기준)
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
            tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
            ticksContainer.appendChild(tick);

            if (i % 5 === 0) {
                const label = document.createElement('div');
                label.className = 'tick-label';
                label.textContent = i === 0 ? '0' : i;
                label.style.transform = `rotate(${i * 6}deg) translateY(0px)`;
                ticksContainer.appendChild(label);
            }
        }

        let totalSeconds = 25 * 60;
        let remainingSeconds = totalSeconds;
        let timer = null;
        let isRunning = false;

        function updateUI() {
            // 남은 시간을 입력창에 표시 (작동 중이 아닐 때는 사용자가 편집 가능)
            const m = Math.floor(remainingSeconds / 60);
            const s = remainingSeconds % 60;
            
            minInput.value = String(m).padStart(2, '0');
            secInput.value = String(s).padStart(2, '0');

            // 바늘 및 부채꼴 각도 업데이트 (60분 스케일 기준)
            const minutes = remainingSeconds / 60;
            const degrees = (minutes / 60) * 360; 

            hand.style.transform = `translateX(-50%) rotate(${degrees}deg)`;
            sector.style.setProperty('--sweep-angle', `${degrees}deg`);
        }

        function validateAndUpdate() {
            if (isRunning) return;

            let m = parseInt(minInput.value, 10) || 0;
            let s = parseInt(secInput.value, 10) || 0;

            // 범주 제한
            if (m < 0) m = 0;
            if (m > 60) m = 60;
            if (s < 0) s = 0;
            if (s > 59) s = 59;

            totalSeconds = (m * 60) + s;
            remainingSeconds = totalSeconds;

            // 각도 업데이트
            const minutes = remainingSeconds / 60;
            const degrees = (minutes / 60) * 360;
            hand.style.transform = `translateX(-50%) rotate(${degrees}deg)`;
            sector.style.setProperty('--sweep-angle', `${degrees}deg`);
        }

        function setQuickTime(m, s) {
            if (isRunning) stopTimer();
            minInput.value = String(m).padStart(2, '0');
            secInput.value = String(s).padStart(2, '0');
            validateAndUpdate();
        }

        function toggleTimer() {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            validateAndUpdate();
            if (remainingSeconds <= 0) return;

            isRunning = true;
            startBtn.textContent = '일시정지';
            startBtn.classList.add('running');
            minInput.disabled = true;
            secInput.disabled = true;

            timer = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateUI();
                } else {
                    stopTimer();
                }
            }, 1000);
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timer);
            startBtn.textContent = '시작';
            startBtn.classList.remove('running');
            minInput.disabled = false;
            secInput.disabled = false;
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = totalSeconds;
            updateUI();
        }

        // 초기화
        updateUI();
    </script>
</body>
</html>
